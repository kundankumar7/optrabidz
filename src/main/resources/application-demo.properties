# DATABASE
spring.datasource.url=${OPTRABIDZ_DATASOURCE_URL}
spring.datasource.username=${OPTRABIDZ_DATASOURCE_USERNAME}
spring.datasource.password=${OPTRABIDZ_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

optrabidz.documentation.api-docs-enabled=true
optrabidz.documentation.swagger-ui-enabled=true
optrabidz.documentation.management-port-enabled=false
optrabidz.documentation.access=PUBLIC
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.csrf.cookie-name=XSRF-TOKEN
springdoc.swagger-ui.csrf.header-name=X-CSRF-TOKEN

optrabidz.financial.local-provider.enabled=false
optrabidz.financial.sandbox-providers.enabled=false
optrabidz.financial.demo-provider.enabled=true
optrabidz.financial.demo-provider.payout-behavior=${OPTRABIDZ_DEMO_PAYOUT_BEHAVIOR:SUCCESS}
optrabidz.financial.webhook.providers.DEMO.enabled=true
optrabidz.financial.webhook.providers.DEMO.active-secret=${OPTRABIDZ_DEMO_WEBHOOK_SECRET}
