# DATABASE
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${OPTRABIDZ_DATASOURCE_URL:jdbc:postgresql://localhost:5432/optrabidz}
spring.datasource.username=${OPTRABIDZ_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${OPTRABIDZ_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.format_sql=true

optrabidz.documentation.api-docs-enabled=true
optrabidz.documentation.swagger-ui-enabled=true
optrabidz.documentation.access=PUBLIC

# DEBUG (optional, enable when needed)
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql=TRACE

optrabidz.admin.bootstrap.enabled=${OPTRABIDZ_ADMIN_BOOTSTRAP_ENABLED:false}
optrabidz.admin.bootstrap.email=${OPTRABIDZ_ADMIN_BOOTSTRAP_EMAIL:}
optrabidz.admin.bootstrap.password=${OPTRABIDZ_ADMIN_BOOTSTRAP_PASSWORD:}
optrabidz.admin.bootstrap.public-display-name=${OPTRABIDZ_ADMIN_BOOTSTRAP_DISPLAY_NAME:}
optrabidz.admin.bootstrap.organization-label=${OPTRABIDZ_ADMIN_BOOTSTRAP_ORGANIZATION:}
optrabidz.admin.recovery.enabled=${OPTRABIDZ_ADMIN_RECOVERY_ENABLED:false}
optrabidz.admin.recovery.token=${OPTRABIDZ_ADMIN_RECOVERY_TOKEN:}

optrabidz.financial.local-provider.enabled=${OPTRABIDZ_LOCAL_PROVIDER_ENABLED:false}
optrabidz.financial.sandbox-providers.enabled=${OPTRABIDZ_SANDBOX_PROVIDERS_ENABLED:false}
optrabidz.financial.webhook.providers.UPI.enabled=${OPTRABIDZ_UPI_WEBHOOK_ENABLED:false}
optrabidz.financial.webhook.providers.UPI.active-secret=${OPTRABIDZ_UPI_WEBHOOK_SECRET:}
optrabidz.financial.webhook.providers.CARD.enabled=${OPTRABIDZ_CARD_WEBHOOK_ENABLED:false}
optrabidz.financial.webhook.providers.CARD.active-secret=${OPTRABIDZ_CARD_WEBHOOK_SECRET:}
