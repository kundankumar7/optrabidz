# DATABASE
# Production must fail startup when any required datasource setting is absent.
spring.datasource.url=${OPTRABIDZ_DATASOURCE_URL}
spring.datasource.username=${OPTRABIDZ_DATASOURCE_USERNAME}
spring.datasource.password=${OPTRABIDZ_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

optrabidz.documentation.api-docs-enabled=${OPTRABIDZ_API_DOCS_ENABLED:false}
optrabidz.documentation.swagger-ui-enabled=false
optrabidz.documentation.management-port-enabled=false
optrabidz.documentation.access=AUTHENTICATED

optrabidz.financial.local-provider.enabled=false
optrabidz.financial.sandbox-providers.enabled=false
