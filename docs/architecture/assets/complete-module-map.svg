<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc">
  <title id="title">OptraBidz module and capability map</title><desc id="desc">All eleven production modules grouped into four navigation capabilities without changing their individual ownership.</desc>
  <defs><style>.bg{fill:#fff}.group{fill:#f8fafc;stroke:#64748b;stroke-width:2}.mod{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.t{font:700 30px "Segoe UI",Arial;fill:#0f172a}.h{font:700 21px "Segoe UI",Arial;fill:#0f172a}.b{font:600 17px "Segoe UI",Arial;fill:#334155}.s{font:400 15px "Segoe UI",Arial;fill:#475569}</style></defs>
  <rect class="bg" width="720" height="980"/><text class="t" x="360" y="48" text-anchor="middle">Module ownership map</text><text class="s" x="360" y="76" text-anchor="middle">Four reader capabilities · eleven code modules</text>
  <rect class="group" x="50" y="105" width="620" height="190" rx="16"/><text class="h" x="75" y="140">Identity and access</text><rect class="mod" x="75" y="165" width="170" height="82" rx="10"/><text class="b" x="160" y="213" text-anchor="middle">security</text><rect class="mod" x="275" y="165" width="170" height="82" rx="10"/><text class="b" x="360" y="213" text-anchor="middle">identity</text><rect class="mod" x="475" y="165" width="170" height="82" rx="10"/><text class="b" x="560" y="213" text-anchor="middle">participation</text>
  <rect class="group" x="50" y="320" width="620" height="190" rx="16"/><text class="h" x="75" y="355">Marketplace</text><rect class="mod" x="75" y="380" width="170" height="82" rx="10"/><text class="b" x="160" y="428" text-anchor="middle">classification</text><rect class="mod" x="275" y="380" width="170" height="82" rx="10"/><text class="b" x="360" y="428" text-anchor="middle">marketplace</text><rect class="mod" x="475" y="380" width="170" height="82" rx="10"/><text class="b" x="560" y="428" text-anchor="middle">governance</text>
  <rect class="group" x="50" y="535" width="620" height="155" rx="16"/><text class="h" x="75" y="570">Finance and payments</text><rect class="mod" x="210" y="595" width="300" height="66" rx="10"/><text class="b" x="360" y="636" text-anchor="middle">financial</text>
  <rect class="group" x="50" y="715" width="620" height="205" rx="16"/><text class="h" x="75" y="750">Platform support</text><rect class="mod" x="75" y="775" width="130" height="82" rx="10"/><text class="b" x="140" y="823" text-anchor="middle">common</text><rect class="mod" x="220" y="775" width="130" height="82" rx="10"/><text class="b" x="285" y="823" text-anchor="middle">audit</text><rect class="mod" x="365" y="775" width="130" height="82" rx="10"/><text class="b" x="430" y="823" text-anchor="middle">notification</text><rect class="mod" x="510" y="775" width="135" height="82" rx="10"/><text class="b" x="577" y="813" text-anchor="middle">documentation</text><text class="s" x="577" y="838" text-anchor="middle">adapter</text>
  <text class="s" x="360" y="956" text-anchor="middle">Capability grouping is navigation—not a deployment boundary</text>
</svg>
