<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc">
  <title id="title">OptraBidz runtime topology</title><desc id="desc">One Spring Boot process contains HTTP adapters, application services, persistence adapters, and three scheduled workers connected to PostgreSQL.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#334155"/></marker><style>.bg{fill:#fff}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.scope{fill:none;stroke:#64748b;stroke-width:2}.worker{fill:#f8fafc;stroke:#64748b;stroke-width:2}.t{font:700 30px "Segoe UI",Arial;fill:#0f172a}.h{font:700 20px "Segoe UI",Arial;fill:#0f172a}.b{font:400 17px "Segoe UI",Arial;fill:#334155}.s{font:600 14px "Segoe UI",Arial;fill:#475569}.w{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="720" height="980"/><text class="t" x="360" y="48" text-anchor="middle">Runtime topology</text><text class="s" x="360" y="76" text-anchor="middle">One deployable application instance</text>
  <rect class="scope" x="45" y="110" width="630" height="680" rx="18"/><text class="s" x="68" y="140">OPTRABIDZAPPLICATION JVM</text>
  <rect id="http-adapters" class="box" x="105" y="170" width="510" height="82" rx="12"/><text class="h" x="360" y="204" text-anchor="middle">HTTP and security adapters</text><text class="b" x="360" y="232" text-anchor="middle">Controllers · filters · Problem Details writers</text>
  <path class="w" data-target="application-domain" d="M360 252V290"/><rect id="application-domain" class="box" x="105" y="290" width="510" height="86" rx="12"/><text class="h" x="360" y="325" text-anchor="middle">Application and domain</text><text class="b" x="360" y="354" text-anchor="middle">Use cases · rules · ports · domain events</text>
  <path class="w" data-target="persistence-adapters" d="M360 376V414"/><rect id="persistence-adapters" class="box" x="105" y="414" width="510" height="86" rx="12"/><text class="h" x="360" y="449" text-anchor="middle">Persistence adapters</text><text class="b" x="360" y="478" text-anchor="middle">JPA repositories · outbox writer · claiming</text>
  <text class="s" x="430" y="548">SCHEDULED RESPONSIBILITIES</text>
  <rect id="outbox-worker" class="worker" x="75" y="570" width="180" height="122" rx="10"/><text class="h" x="165" y="605" text-anchor="middle">Outbox</text><text class="b" x="165" y="635" text-anchor="middle">claim + route</text><text class="b" x="165" y="663" text-anchor="middle">events</text>
  <rect id="delivery-worker" class="worker" x="270" y="570" width="180" height="122" rx="10"/><text class="h" x="360" y="605" text-anchor="middle">Delivery</text><text class="b" x="360" y="635" text-anchor="middle">retry channel</text><text class="b" x="360" y="663" text-anchor="middle">attempts</text>
  <rect id="lifecycle-worker" class="worker" x="465" y="570" width="180" height="122" rx="10"/><text class="h" x="555" y="605" text-anchor="middle">Lifecycle</text><text class="b" x="555" y="635" text-anchor="middle">expire guarded</text><text class="b" x="555" y="663" text-anchor="middle">state</text>
  <path class="w" data-target="runtime-database" d="M165 692V770H250V830"/><path class="w" data-target="runtime-database" d="M360 692V830"/><path class="w" data-target="runtime-database" d="M555 692V770H470V830"/><path class="w" data-target="outbox-worker" d="M360 500V530H165V570"/>
  <rect id="runtime-database" class="box" x="105" y="830" width="510" height="92" rx="12"/><text class="h" x="360" y="868" text-anchor="middle">PostgreSQL system of record</text><text class="b" x="360" y="899" text-anchor="middle">Flyway schema · server-side sessions · durable queues</text>
  <text class="s" x="360" y="955" text-anchor="middle">Every enabled instance hosts all three workers</text>
</svg>
