<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
  <title id="title">OptraBidz system overview</title>
  <desc id="desc">Clients enter through the Spring MVC and session-security boundary, invoke business modules in one Spring Boot application, and commit data and outbox records to PostgreSQL. Outbox records are processed into audit records and notification delivery.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2E3A46" />
    </marker>
    <style>
      .canvas { fill: #F7F3EA; }
      .node { fill: #FFFDF8; stroke: #D8CDBD; stroke-width: 2; }
      .boundary { fill: #E7F3F4; stroke: #146C78; }
      .core { fill: #F2EAF5; stroke: #6E4A7E; }
      .data { fill: #EEF4E8; stroke: #4F6F3A; }
      .event { fill: #FCEBE6; stroke: #B55239; }
      .title { font: 700 30px "Segoe UI", Arial, sans-serif; fill: #17212B; }
      .heading { font: 700 23px "Segoe UI", Arial, sans-serif; fill: #17212B; }
      .body { font: 400 20px "Segoe UI", Arial, sans-serif; fill: #485461; }
      .wire { fill: none; stroke: #2E3A46; stroke-width: 2.5; marker-end: url(#arrow); }
      .label { font: 600 18px "Segoe UI", Arial, sans-serif; fill: #485461; }
    </style>
  </defs>

  <rect class="canvas" width="720" height="900" />
  <text class="title" x="360" y="48" text-anchor="middle">OptraBidz system overview</text>

  <g aria-label="Clients">
    <rect class="node boundary" x="170" y="78" width="380" height="86" rx="12" />
    <text class="heading" x="360" y="112" text-anchor="middle">Clients</text>
    <text class="body" x="360" y="142" text-anchor="middle">Browser, API clients, Swagger UI</text>
  </g>

  <path class="wire" d="M360 164 V202" />

  <g aria-label="HTTP and security boundary">
    <rect class="node boundary" x="120" y="202" width="480" height="102" rx="12" />
    <text class="heading" x="360" y="240" text-anchor="middle">HTTP + session-security boundary</text>
    <text class="body" x="360" y="272" text-anchor="middle">Spring MVC, sessions, CSRF, role checks</text>
  </g>

  <path class="wire" d="M360 304 V342" />

  <g aria-label="Modular monolith">
    <rect class="node core" x="86" y="342" width="548" height="126" rx="12" />
    <text class="heading" x="360" y="381" text-anchor="middle">Modular Spring Boot application</text>
    <text class="body" x="360" y="416" text-anchor="middle">Identity · Marketplace · Finance</text>
    <text class="body" x="360" y="446" text-anchor="middle">Governance · Audit · Notifications</text>
  </g>

  <path class="wire" d="M360 468 V500 H190 V548" />
  <path class="wire" d="M360 500 H530 V548" />
  <text class="label" x="205" y="522">durable state</text>
  <text class="label" x="421" y="522">committed events</text>

  <g aria-label="PostgreSQL">
    <rect class="node data" x="45" y="548" width="290" height="108" rx="12" />
    <text class="heading" x="190" y="590" text-anchor="middle">PostgreSQL</text>
    <text class="body" x="190" y="625" text-anchor="middle">Flyway-owned schema</text>
  </g>

  <g aria-label="Transactional outbox">
    <rect class="node event" x="385" y="548" width="290" height="108" rx="12" />
    <text class="heading" x="530" y="590" text-anchor="middle">Transactional outbox</text>
    <text class="body" x="530" y="625" text-anchor="middle">Reliable post-commit work</text>
  </g>

  <path class="wire" d="M530 656 V700 H190 V746" />
  <path class="wire" d="M530 700 V746" />

  <g aria-label="Audit records">
    <rect class="node data" x="45" y="746" width="290" height="108" rx="12" />
    <text class="heading" x="190" y="788" text-anchor="middle">Audit records</text>
    <text class="body" x="190" y="823" text-anchor="middle">Traceable business history</text>
  </g>

  <g aria-label="Notification delivery">
    <rect class="node event" x="385" y="746" width="290" height="108" rx="12" />
    <text class="heading" x="530" y="788" text-anchor="middle">Notification delivery</text>
    <text class="body" x="530" y="823" text-anchor="middle">In-app, sandbox email + push</text>
  </g>
</svg>
