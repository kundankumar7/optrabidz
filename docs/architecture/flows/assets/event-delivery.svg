<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1060" viewBox="0 0 720 1060" role="img" aria-labelledby="title desc">
  <title id="title">Transactional outbox and delivery flow</title><desc id="desc">Business state and an outbox event commit together. Scheduled processors later create audit records and notification deliveries with retry state.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#334155"/></marker><style>.bg{fill:#fff}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.tx{fill:#f8fafc;stroke:#64748b;stroke-width:2}.note{fill:#fff7ed;stroke:#ea580c;stroke-width:1.5}.t{font:700 30px "Segoe UI",Arial;fill:#0f172a}.h{font:700 20px "Segoe UI",Arial;fill:#0f172a}.b{font:400 17px "Segoe UI",Arial;fill:#334155}.s{font:600 14px "Segoe UI",Arial;fill:#475569}.w{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="720" height="1060"/><text class="t" x="360" y="48" text-anchor="middle">Event delivery</text><text class="s" x="360" y="76" text-anchor="middle">Durable post-commit work without an external broker</text>
  <rect class="box" x="110" y="105" width="500" height="78" rx="12"/><text class="h" x="360" y="152" text-anchor="middle">Application service accepts transition</text><path class="w" d="M360 183V225"/>
  <rect class="tx" x="65" y="225" width="590" height="245" rx="16"/><text class="s" x="90" y="255">ONE DATABASE TRANSACTION</text><rect class="box" x="100" y="280" width="520" height="70" rx="10"/><text class="h" x="360" y="323" text-anchor="middle">Persist business state</text><path class="w" d="M360 350V382"/><rect class="box" x="100" y="382" width="520" height="62" rx="10"/><text class="h" x="360" y="421" text-anchor="middle">Write serialized outbox event</text>
  <path class="w" d="M360 470V520"/><rect class="box" x="110" y="520" width="500" height="82" rx="12"/><text class="h" x="360" y="554" text-anchor="middle">OutboxDispatcher claims batch</text><text class="b" x="360" y="583" text-anchor="middle">database claim + registered processors</text><path class="w" d="M360 602V646H200V680"/><path class="w" d="M360 646H520V680"/>
  <rect class="box" x="55" y="680" width="290" height="118" rx="12"/><text class="h" x="200" y="717" text-anchor="middle">Audit processor</text><text class="b" x="200" y="748" text-anchor="middle">policy resolution</text><text class="b" x="200" y="776" text-anchor="middle">durable audit record</text>
  <rect class="box" x="375" y="680" width="290" height="118" rx="12"/><text class="h" x="520" y="717" text-anchor="middle">Notification processor</text><text class="b" x="520" y="748" text-anchor="middle">recipients + subscriptions</text><text class="b" x="520" y="776" text-anchor="middle">delivery rows</text><path class="w" d="M520 798V846"/>
  <rect class="box" x="375" y="846" width="290" height="104" rx="12"/><text class="h" x="520" y="882" text-anchor="middle">DeliveryDispatcher</text><text class="b" x="520" y="912" text-anchor="middle">attempt · retry · terminal</text><text class="b" x="520" y="938" text-anchor="middle">in-app / sandbox</text>
  <rect class="note" x="55" y="982" width="610" height="52" rx="10"/><text class="s" x="360" y="1014" text-anchor="middle">Replay-safe processing required · Kafka is not implemented</text>
</svg>
