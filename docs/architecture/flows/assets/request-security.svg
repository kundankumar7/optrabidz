<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1040" viewBox="0 0 720 1040" role="img" aria-labelledby="title desc">
  <title id="title">Request and security flow</title><desc id="desc">Spring Security classifies the route and validates the server-side session before the controller adapts an authenticated request. Application services retain ownership and business authorization.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#334155"/></marker><style>.bg{fill:#fff}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.deny{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.t{font:700 30px "Segoe UI",Arial;fill:#0f172a}.h{font:700 20px "Segoe UI",Arial;fill:#0f172a}.b{font:400 17px "Segoe UI",Arial;fill:#334155}.s{font:600 14px "Segoe UI",Arial;fill:#475569}.w{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="720" height="1040"/><text class="t" x="360" y="48" text-anchor="middle">Request and security flow</text><text class="s" x="360" y="76" text-anchor="middle">Session authentication precedes HTTP adaptation</text>
  <rect class="box" x="110" y="105" width="500" height="74" rx="12"/><text class="h" x="360" y="150" text-anchor="middle">HTTP request</text><path class="w" d="M360 179V220"/>
  <rect class="box" x="110" y="220" width="500" height="92" rx="12"/><text class="h" x="360" y="256" text-anchor="middle">SecurityConfig route policy</text><text class="b" x="360" y="286" text-anchor="middle">public · authenticated · role restricted</text><path class="w" d="M360 312V354"/>
  <rect class="box" x="110" y="354" width="500" height="102" rx="12"/><text class="h" x="360" y="390" text-anchor="middle">ActiveSessionFilter + CSRF</text><text class="b" x="360" y="420" text-anchor="middle">server-side session · active account</text><text class="b" x="360" y="447" text-anchor="middle">browser mutation token</text><path class="w" d="M610 405H650V515"/><text class="s" x="617" y="490">reject</text>
  <rect class="deny" x="400" y="515" width="270" height="112" rx="12"/><text class="h" x="535" y="552" text-anchor="middle">Security rejection</text><text class="b" x="535" y="583" text-anchor="middle">authentication entry point</text><text class="b" x="535" y="611" text-anchor="middle">or access denied handler</text>
  <path class="w" d="M360 456V515H300"/><rect class="box" x="50" y="515" width="300" height="112" rx="12"/><text class="h" x="200" y="552" text-anchor="middle">Controller adapter</text><text class="b" x="200" y="583" text-anchor="middle">validated input + actor</text><text class="b" x="200" y="611" text-anchor="middle">to command/query</text><path class="w" d="M200 627V680"/>
  <rect class="box" x="110" y="680" width="500" height="102" rx="12"/><text class="h" x="360" y="716" text-anchor="middle">Owning application service</text><text class="b" x="360" y="746" text-anchor="middle">resource ownership · account state</text><text class="b" x="360" y="774" text-anchor="middle">business and lifecycle rules</text><path class="w" d="M360 782V824"/>
  <rect class="box" x="110" y="824" width="500" height="82" rx="12"/><text class="h" x="360" y="858" text-anchor="middle">Repository adapter</text><text class="b" x="360" y="887" text-anchor="middle">commit accepted state</text>
  <path class="w" d="M535 627V948H460"/><path class="w" d="M360 906V948"/><rect class="box" x="110" y="948" width="500" height="66" rx="12"/><text class="h" x="360" y="989" text-anchor="middle">Stable HTTP response / Problem Details</text>
</svg>
