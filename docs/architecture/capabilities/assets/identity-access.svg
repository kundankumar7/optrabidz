<svg xmlns="http://www.w3.org/2000/svg" width="720" height="940" viewBox="0 0 720 940" role="img" aria-labelledby="title desc">
  <title id="title">Identity and access responsibility flow</title><desc id="desc">Spring Security authenticates a server-side session, while identity and participation modules provide account, role, profile, and ownership facts used by application services.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#334155"/></marker><style>.bg{fill:#fff}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.fact{fill:#f8fafc;stroke:#64748b;stroke-width:2}.future{fill:#fff7ed;stroke:#ea580c;stroke-width:1.5;stroke-dasharray:7 6}.t{font:700 30px "Segoe UI",Arial;fill:#0f172a}.h{font:700 20px "Segoe UI",Arial;fill:#0f172a}.b{font:400 17px "Segoe UI",Arial;fill:#334155}.s{font:600 14px "Segoe UI",Arial;fill:#475569}.w{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="720" height="940"/><text class="t" x="360" y="48" text-anchor="middle">Identity and access</text><text class="s" x="360" y="76" text-anchor="middle">Authentication mechanics stay separate from business ownership</text>
  <rect class="box" x="110" y="110" width="500" height="90" rx="12"/><text class="h" x="360" y="147" text-anchor="middle">Spring Security adapter</text><text class="b" x="360" y="177" text-anchor="middle">credentials · server-side session · CSRF · routes</text><path class="w" d="M360 200V250"/>
  <rect class="box" x="110" y="250" width="500" height="92" rx="12"/><text class="h" x="360" y="287" text-anchor="middle">Authenticated actor contract</text><text class="b" x="360" y="317" text-anchor="middle">account ID · granted role · active session</text><path class="w" d="M360 342V392"/>
  <rect class="fact" x="60" y="392" width="285" height="130" rx="12"/><text class="h" x="202" y="430" text-anchor="middle">identity module</text><text class="b" x="202" y="461" text-anchor="middle">account · role · active state</text><text class="b" x="202" y="490" text-anchor="middle">profile completeness</text>
  <rect class="fact" x="375" y="392" width="285" height="130" rx="12"/><text class="h" x="517" y="430" text-anchor="middle">participation module</text><text class="b" x="517" y="461" text-anchor="middle">admin · startup · investor</text><text class="b" x="517" y="490" text-anchor="middle">resource ownership</text>
  <path class="w" d="M202 522V590H320"/><path class="w" d="M517 522V590H400"/><rect class="box" x="110" y="590" width="500" height="106" rx="12"/><text class="h" x="360" y="628" text-anchor="middle">Owning application service</text><text class="b" x="360" y="660" text-anchor="middle">role + account state + ownership + domain rules</text>
  <path class="w" d="M360 696V746"/><rect class="box" x="110" y="746" width="500" height="82" rx="12"/><text class="h" x="360" y="779" text-anchor="middle">Accepted business operation</text><text class="b" x="360" y="807" text-anchor="middle">or a stable boundary error</text>
  <rect class="future" x="110" y="860" width="500" height="52" rx="10"/><text class="s" x="360" y="892" text-anchor="middle">PLANNED ADAPTERS: JWT resource server · OAuth2 login</text>
</svg>
