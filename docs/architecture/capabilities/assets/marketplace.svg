<svg xmlns="http://www.w3.org/2000/svg" width="720" height="940" viewBox="0 0 720 940" role="img" aria-labelledby="title desc">
  <title id="title">Marketplace capability lifecycle</title><desc id="desc">Classification and governance rules guard the marketplace sequence from listing discovery through bidding and agreement creation.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#334155"/></marker><style>.bg{fill:#fff}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.guard{fill:#f8fafc;stroke:#64748b;stroke-width:2}.t{font:700 30px "Segoe UI",Arial;fill:#0f172a}.h{font:700 20px "Segoe UI",Arial;fill:#0f172a}.b{font:400 17px "Segoe UI",Arial;fill:#334155}.s{font:600 14px "Segoe UI",Arial;fill:#475569}.w{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="720" height="940"/><text class="t" x="360" y="48" text-anchor="middle">Marketplace lifecycle</text><text class="s" x="360" y="76" text-anchor="middle">Guarded transitions in the current modular monolith</text>
  <rect id="classification" class="guard" x="55" y="115" width="280" height="118" rx="12"/><text class="h" x="195" y="153" text-anchor="middle">classification</text><text class="b" x="195" y="184" text-anchor="middle">startup sectors</text><text class="b" x="195" y="211" text-anchor="middle">investor preferences</text>
  <rect id="governance" class="guard" x="385" y="115" width="280" height="118" rx="12"/><text class="h" x="525" y="153" text-anchor="middle">governance</text><text class="b" x="525" y="184" text-anchor="middle">eligibility · authority</text><text class="b" x="525" y="211" text-anchor="middle">neutrality · lifecycle</text>
  <path class="w" data-target="publish-listing" d="M195 233V290"/><path class="w" data-target="publish-listing" d="M525 233V290"/>
  <rect id="publish-listing" class="box" x="110" y="290" width="500" height="92" rx="12"/><text class="h" x="360" y="327" text-anchor="middle">Publish funding listing</text><text class="b" x="360" y="357" text-anchor="middle">startup ownership and eligibility required</text><path class="w" data-target="discover" d="M360 382V430"/>
  <rect id="discover" class="box" x="110" y="430" width="500" height="92" rx="12"/><text class="h" x="360" y="467" text-anchor="middle">Discover and recommend</text><text class="b" x="360" y="497" text-anchor="middle">current public reads + preference matching</text><path class="w" data-target="evaluate-bid" d="M360 522V570"/>
  <rect id="evaluate-bid" class="box" x="110" y="570" width="500" height="92" rx="12"/><text class="h" x="360" y="607" text-anchor="middle">Submit and evaluate bid</text><text class="b" x="360" y="637" text-anchor="middle">investor identity · guarded state transition</text><path class="w" data-target="create-agreement" d="M360 662V710"/>
  <rect id="create-agreement" class="box" x="110" y="710" width="500" height="92" rx="12"/><text class="h" x="360" y="747" text-anchor="middle">Create agreement</text><text class="b" x="360" y="777" text-anchor="middle">accepted terms become finance input</text>
  <path class="w" data-target="financial-capability" d="M360 802V850"/><rect id="financial-capability" class="guard" x="170" y="850" width="380" height="62" rx="10"/><text class="h" x="360" y="889" text-anchor="middle">financial capability</text>
</svg>
