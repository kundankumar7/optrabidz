<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc">
  <title id="title">Finance and payment lifecycle</title><desc id="desc">An accepted agreement creates settlement and repayment obligations. Payment intents produce provider attempts, while signed callbacks update results with replay protection.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#334155"/></marker><style>.bg{fill:#fff}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.boundary{fill:#f8fafc;stroke:#64748b;stroke-width:2}.future{fill:#fff7ed;stroke:#ea580c;stroke-width:1.5;stroke-dasharray:7 6}.t{font:700 30px "Segoe UI",Arial;fill:#0f172a}.h{font:700 20px "Segoe UI",Arial;fill:#0f172a}.b{font:400 17px "Segoe UI",Arial;fill:#334155}.s{font:600 14px "Segoe UI",Arial;fill:#475569}.w{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="720" height="980"/><text class="t" x="360" y="48" text-anchor="middle">Finance and payments</text><text class="s" x="360" y="76" text-anchor="middle">Current obligations, attempts, and callback controls</text>
  <rect id="accepted-agreement" class="boundary" x="110" y="110" width="500" height="76" rx="12"/><text class="h" x="360" y="143" text-anchor="middle">Accepted marketplace agreement</text><text class="b" x="360" y="170" text-anchor="middle">principal · terms · parties</text><path class="w" data-target="repayment-schedule" d="M360 186V230"/>
  <rect id="repayment-schedule" class="box" x="110" y="230" width="500" height="90" rx="12"/><text class="h" x="360" y="266" text-anchor="middle">Settlement and repayment schedule</text><text class="b" x="360" y="296" text-anchor="middle">guarded lifecycle and due obligations</text><path class="w" data-target="payment-intent" d="M360 320V364"/>
  <rect id="payment-intent" class="box" x="110" y="364" width="500" height="90" rx="12"/><text class="h" x="360" y="400" text-anchor="middle">Payment intent</text><text class="b" x="360" y="430" text-anchor="middle">purpose · amount · idempotency key</text><path class="w" data-target="provider-attempt" d="M360 454V498"/>
  <rect id="provider-attempt" class="box" x="110" y="498" width="500" height="90" rx="12"/><text class="h" x="360" y="534" text-anchor="middle">Provider attempt</text><text class="b" x="360" y="564" text-anchor="middle">configured method · local/sandbox strategy</text><path class="w" data-target="provider-callback" d="M360 588V610H205V632"/>
  <rect id="provider-callback" class="boundary" x="70" y="632" width="270" height="112" rx="12"/><text class="h" x="205" y="668" text-anchor="middle">Provider callback</text><text class="b" x="205" y="698" text-anchor="middle">HMAC · timestamp</text><text class="b" x="205" y="726" text-anchor="middle">body limit · strict parse</text>
  <rect id="replay-protection" class="box" x="380" y="632" width="270" height="112" rx="12"/><text class="h" x="515" y="668" text-anchor="middle">Replay protection</text><text class="b" x="515" y="698" text-anchor="middle">event identity</text><text class="b" x="515" y="726" text-anchor="middle">provider ownership</text><path class="w" data-target="replay-protection" d="M340 688H380"/>
  <path class="w" data-target="result-transition" d="M515 744V792"/><rect id="result-transition" class="box" x="110" y="792" width="500" height="90" rx="12"/><text class="h" x="360" y="828" text-anchor="middle">Idempotent result transition</text><text class="b" x="360" y="858" text-anchor="middle">attempt + intent + obligation state</text>
  <rect class="future" x="110" y="910" width="500" height="48" rx="10"/><text class="s" x="360" y="940" text-anchor="middle">NOT IMPLEMENTED: real-money payment gateway</text>
</svg>
