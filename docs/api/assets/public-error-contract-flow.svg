<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800" role="img" aria-labelledby="title desc">
  <title id="title">Public error contract publication</title>
  <desc id="desc">Module, framework, and security definitions merge into one validated public catalogue. The catalogue drives OpenAPI and Markdown outputs. A separate fail-closed boundary controls HTTP documentation access, and tests verify all published contracts.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#344253"/>
    </marker>
    <style>
      .canvas{fill:#F7F3EA}.title{font:700 30px "Segoe UI",Arial,sans-serif;fill:#17212B}.head{font:700 22px "Segoe UI",Arial,sans-serif;fill:#17212B}.body{font:400 18px "Segoe UI",Arial,sans-serif;fill:#2E3A46}
      .node{stroke-width:2;rx:10}.source{fill:#EAF6F1;stroke:#2F7D67}.catalogue{fill:#E8F6F8;stroke:#2E7D8D}.published{fill:#F4ECF7;stroke:#7A4E91}.security{fill:#FCEAE5;stroke:#B45A45}.verification{fill:#FFF1D6;stroke:#A96616}
      .wire{fill:none;stroke:#344253;stroke-width:2.5;stroke-linecap:square;stroke-linejoin:round;marker-end:url(#arrow)}.check{fill:none;stroke:#6A7480;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#arrow)}.label{font:600 16px "Segoe UI",Arial,sans-serif;fill:#344253}
    </style>
  </defs>

  <rect class="canvas" width="900" height="800"/>
  <text class="title" x="450" y="46" text-anchor="middle">Public error contract publication</text>

  <g aria-label="Owned public definitions">
    <rect class="node source" x="230" y="76" width="440" height="104" rx="10"/>
    <text class="head" x="450" y="116" text-anchor="middle">1. Owned public definitions</text>
    <text class="body" x="450" y="151" text-anchor="middle">Module · Framework · Security</text>
  </g>

  <path class="wire" d="M450 180 V220"/>

  <g aria-label="Validated public catalogue">
    <rect class="node catalogue" x="230" y="220" width="440" height="110" rx="10"/>
    <text class="head" x="450" y="263" text-anchor="middle">2. Public error catalogue</text>
    <text class="body" x="450" y="299" text-anchor="middle">Merge by code · Reject conflicting definitions</text>
  </g>

  <path class="wire" d="M450 330 V370 H220 V404"/>
  <path class="wire" d="M450 370 H680 V404"/>

  <g aria-label="OpenAPI contract">
    <rect class="node published" x="40" y="404" width="360" height="126" rx="10"/>
    <text class="head" x="220" y="447" text-anchor="middle">3A. OpenAPI contract</text>
    <text class="body" x="220" y="482" text-anchor="middle">Problem schemas · Reusable responses</text>
    <text class="body" x="220" y="510" text-anchor="middle">Public error-code enum</text>
  </g>

  <g aria-label="Generated Markdown catalogue">
    <rect class="node published" x="500" y="404" width="360" height="126" rx="10"/>
    <text class="head" x="680" y="447" text-anchor="middle">3B. Markdown catalogue</text>
    <text class="body" x="680" y="482" text-anchor="middle">Generated checked-in snapshot</text>
    <text class="body" x="680" y="510" text-anchor="middle">One row per public code</text>
  </g>

  <path class="wire" d="M220 530 V604"/>
  <text class="label" x="238" y="574">served through</text>

  <g aria-label="HTTP documentation access boundary">
    <rect class="node security" x="40" y="604" width="360" height="142" rx="10"/>
    <text class="head" x="220" y="646" text-anchor="middle">4. HTTP documentation access</text>
    <text class="body" x="220" y="681" text-anchor="middle">Disabled · Authenticated · Public</text>
    <text class="body" x="220" y="713" text-anchor="middle">Production rejects public Swagger UI</text>
  </g>

  <g aria-label="Contract verification">
    <rect class="node verification" x="500" y="604" width="360" height="142" rx="10"/>
    <text class="head" x="680" y="646" text-anchor="middle">5. Contract verification</text>
    <text class="body" x="680" y="681" text-anchor="middle">Parity · Inventory · Exposure</text>
    <text class="body" x="680" y="713" text-anchor="middle">Disclosure and snapshot tests</text>
  </g>

  <path class="check" d="M400 467 H454 V638 H500"/>
  <path class="check" d="M680 530 V604"/>
  <path class="check" d="M400 702 H500"/>
</svg>
